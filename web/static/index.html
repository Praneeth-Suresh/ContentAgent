<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ContentAgent Marketing Agent</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-labelledby="app-title">
        <div class="control-panel">
          <div>
            <p class="eyebrow">Marketing Agent</p>
            <h1 id="app-title">Monetization plan builder</h1>
          </div>

          <form id="source-form" class="source-form">
            <label for="software-source">Software Source</label>
            <div class="source-row">
              <input
                id="software-source"
                name="software-source"
                type="url"
                placeholder="https://github.com/acme/product"
                autocomplete="url"
                required
              >
              <button type="submit" id="generate-button">Generate</button>
            </div>
          </form>

          <div class="feedback-panel" aria-labelledby="feedback-title">
            <h2 id="feedback-title">User Intervention</h2>
            <label for="stage-select">Generation Stage</label>
            <select id="stage-select">
              <option>Market Research</option>
              <option>Campaign Orchestration</option>
              <option>Content Generation</option>
            </select>
            <label for="feedback-input">Feedback</label>
            <textarea id="feedback-input" rows="4" placeholder="Add creative direction, audience focus, or offer constraints."></textarea>
            <button type="button" id="add-feedback-button">Add feedback</button>
            <ul id="feedback-list" class="feedback-list" aria-live="polite"></ul>
          </div>
        </div>

        <div class="plan-panel">
          <div class="stage-strip" id="stage-strip" aria-label="Generation stages"></div>
          <canvas id="workflow-map" width="920" height="180" aria-label="Marketing Agent workflow map"></canvas>

          <div class="result-grid">
            <section class="summary-panel" aria-labelledby="summary-title">
              <h2 id="summary-title">Plan Summary</h2>
              <p id="status-line">Enter a Software Source to generate a Marketing Plan.</p>
              <dl id="plan-metrics" class="plan-metrics"></dl>
            </section>

            <section class="editor-panel" aria-labelledby="editor-title">
              <div class="editor-heading">
                <h2 id="editor-title">Editable Marketing Plan</h2>
                <button type="button" id="regenerate-button">Regenerate with feedback</button>
              </div>
              <textarea id="plan-editor" rows="22" spellcheck="true"></textarea>
            </section>
          </div>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
